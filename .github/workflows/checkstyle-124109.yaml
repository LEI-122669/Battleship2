# 124109 Salvador Gomes
name: Checkstyle gate 124109

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  checkstyle-124109:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkstyle (ConstantName)
        uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-124109.xml
          reporter: github-pr-check
          level: error
          fail_level: error
