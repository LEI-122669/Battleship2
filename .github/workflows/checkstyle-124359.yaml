# 124359 Roman Havrylenko
name: Checkstyle gate 124359

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Run Checkstyle
        run: |
          mvn checkstyle:check -Dcheckstyle.config.location=checkstyle-124359.xml