# 124359 - Roman Havrylenko
name: Qodana smell gate 124359

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: JetBrains/qodana-action@v2024.2.5
        with:
          args: --config qodana-124359.yaml
          use-annotations: true
          post-pr-comment: true