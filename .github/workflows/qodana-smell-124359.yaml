# 124359 Roman Havrylenko
name: Qodana smell gate 124359

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: >-
            --config qodana-124359.yaml
            --profile .qodana/profiles/profile-124359.yaml
          use-annotations: true
          post-pr-comment: true