# 87711 - José Gil

name: Qodana - Large Class quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-annotations: true
          upload-result: true
          artifact-name: qodana-large-class-report
