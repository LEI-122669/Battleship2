# 87711 - José Gil

name: Qodana smell gate 87711

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: >-
            --config qodana-87711.yaml
            --profile-path .qodana/profiles/profile-87711.yaml
          pr-mode: true
          use-annotations: true
          post-pr-comment: true
          
      - name: Verify Qodana files
        run: |
              pwd
              ls -la
              cat qodana-87711.yaml
              cat .qodana/profiles/profile-87711.yaml
