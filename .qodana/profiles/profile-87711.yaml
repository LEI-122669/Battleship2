# 87711 - José Gil

version: "1.0"

profile:
  base:
    name: empty            # nenhuma inspeção ativa à partida

  inspections:
    # Limite configurado para o trabalho: 10 métodos
    - inspection: MethodCount
      enabled: true
      options:
        m_limit: 10

    # Limite configurado para o trabalho: complexidade 80
    - inspection: ClassComplexity
      enabled: true
      options:
        m_limit: 80
